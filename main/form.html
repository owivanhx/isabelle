<body>
    <div class="formulario">
        <h3> cadastro ♰ </h3>
        <p> adicione as informações </p>
        
        <form id="meuformulario">
            <label for="titulo">nome do personagem</label>
            <input type="text" id="titulo" placeholder="escreva.." required><br>
            
            <label for="imagem">foto do personagem</label>
            <input type="url" id="imagem" placeholder="escreva..." required><br>
            
            <label for="paragrafo">descrição da imagem/personagem</label>
            <textarea id="paragrafo" placeholder="escreva..." required></textarea>
            
            <button type="submit"> adicionar ⟡˖ ࣪</button>
        </form>
    </div>
    
    <div id="colecao"></div>
    
    <script src="script.js"></script>
